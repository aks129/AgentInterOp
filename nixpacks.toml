# Force Nixpacks to use the Python provider on Railway.
# Without this it auto-detects Node from package.json (Playwright test deps).
providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "uv", "gcc"]

[phases.install]
cmds = [
  "uv venv --python python3.11 /opt/venv",
  "VIRTUAL_ENV=/opt/venv uv pip install -e .",
]

[start]
cmd = "/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
